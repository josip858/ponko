[package]
name = "ponko"
version = "0.0.1"
description = "A code-first 2D and 3D game engine with integrated simulation, C++ bindings, and tools for AI-assisted development."
keywords = ["gamedev", "engine", "2d", "3d", "ecs"]
categories = ["game-engines", "game-development", "simulation"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ponko/"
# The guide, CI, the web shell and the C/C++ side aren't part of the crate.
exclude = ["/book", "/.github", "/web", "/include", "/examples/cpp", "/docs", "/rustfmt.toml", "/CLAUDE.md", "/AGENTS.md", "/.mcp.json"]

[package.metadata.docs.rs]
features = ["physics", "physics3d", "steam", "3d", "navmesh", "accessibility"]

[dependencies]
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
navmesh-rs = { version = "0.2.1", optional = true, default-features = false, features = ["std", "libm", "recast", "detour", "crowd", "tilecache", "polyref64"] }
renet = "2.0.0"
ponko_ecs = { path = "crates/ponko_ecs", version = "0.0.1", features = ["serde"] }
half = "2.7.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.1", optional = true, features = ["glsl"] }
winit = { version = "0.30.13", optional = true }
puffin = { version = "0.20.0", optional = true }
puffin_http = { version = "0.17.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
rapier2d = { version = "0.36.1", optional = true }
rapier3d = { version = "0.36.1", optional = true }
fontdue = "0.9.5"
epaint_default_fonts = "0.37.0"
kira = { version = "0.12.6", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm", "mp3", "flac"], optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts"], optional = true }
egui-wgpu = { version = "0.37", default-features = false, optional = true }
egui-winit = { version = "0.37", default-features = false, optional = true }
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", default-features = false, optional = true }
# `Instant` that also works in browsers; on desktop it is std's own type.
web-time = "1.1.0"
gilrs = { version = "0.11.2", optional = true }
steamworks = { version = "0.13.1", optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"], optional = true }
# Accessibility tree data types (feature `accessibility`); the same crate
# and version the inspector's egui already brings in.
accesskit = { version = "0.25.2", optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"

# The screen-reader adapter (feature `accessibility`): AccessKit's macOS
# adapter, which answers the system's accessibility queries for the window's
# view. The `accesskit` data types themselves are in [dependencies].
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.2", optional = true }

# The web build (wasm32): the browser APIs for the canvas and fetching
# assets, and WebGL2 for browsers without WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", optional = true, features = ["webgl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
# Sound through WebAudio (kira plays through cpal).
cpal = { version = "0.18.2", features = ["wasm-bindgen"], optional = true }
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Response", "console"] }

# The validation bundle example drives a launched game through the MCP
# server's tools, in-process. Path only (no version): the MCP crate's tests
# depend on the engine, and a published cycle between the two can't resolve.
[dev-dependencies]
ponko_mcp = { path = "crates/ponko_mcp" }

# The native accessibility test (tests/ui_access_macos.rs) asks an `NSView`
# what a screen reader would ask it. The same objc2 versions AccessKit's
# macOS adapter uses.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSString", "NSValue"] }

# The browser smoke fixture (examples/web_smoke.rs) reports its state to
# the page; the engine already depends on web-sys there.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "Location"] }

[features]
# Pure Rust Recast baking and Detour queries; no window, Bevy or async runtime.
navmesh = ["3d", "dep:navmesh-rs"]
default = ["audio", "window", "inspector", "gamepad"]
# A window and GPU rendering (winit + wgpu). Off: `Game::run_headless` only,
# for simulation servers and CI; drawing calls do nothing, `Game::run` panics.
window = ["dep:wgpu", "dep:winit", "dep:pollster"]
# Sound with kira. Off: the sound API stays and is silent (for servers).
audio = ["dep:kira", "dep:cpal"]
# The runtime inspector (egui overlay, toggled with the ` key): entities and their
# components with live editing, resources, system timings, sim controls.
# Off: no egui in the build.
inspector = ["window", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Screen-reader support for the retained UI (`ctx.ui`): roles, names, values
# and focus are given to the system's accessibility API, and its requests
# (press, focus, set value) reach the UI. macOS (VoiceOver) only for now;
# on other systems the feature builds and does nothing. Off: no adapter;
# `Ui::accessibility_tree` and `UiAccessTracker` are always there.
accessibility = ["window", "dep:accesskit", "dep:accesskit_macos"]
# Gamepads through gilrs (Xbox, PlayStation, Switch and other controllers).
# Off: `ctx.gamepads()` is always empty. On Linux it needs libudev headers.
gamepad = ["window", "dep:gilrs"]
# Frame profiler: per-system scopes, viewable live with `puffin_viewer`
# (cargo install puffin_viewer; connects to 127.0.0.1:8585).
profiling = ["dep:puffin", "dep:puffin_http"]
# Hot-patch system code while the game runs, keeping all its state: run
# with Dioxus's CLI, `dx serve --hot-patch --features hotpatch` (see the
# guide's "Changing code while the game runs" chapter). Off: systems are called directly.
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]
# 2D physics with rapier: `Game::physics`, the RigidBody / Collider /
# Velocity components, collision events and ray casts. Off: no rapier in the build.
physics = ["dep:rapier2d"]
# 3D physics with rapier: `Game::physics3d`, the RigidBody3D / Collider3D /
# Velocity3D / Character3D components, collision events, ray and shape
# queries, a character controller. Off: no rapier3d in the build.
physics3d = ["3d", "dep:rapier3d"]
# Networking over Steam (`Net` and `NetMessages`): Steam's relays
# and lobbies, so friends join from the overlay. Re-exports `steamworks`.
# Ship the Steamworks redistributable (libsteam_api) next to the game.
steam = ["dep:steamworks"]
# Physics that gives bit-identical results on every platform (for lockstep
# networking and replays), a little slower: rapier's enhanced-determinism
# (for 3D physics too, when `physics3d` is on).
physics-determinism = ["physics", "rapier2d/enhanced-determinism", "rapier3d?/enhanced-determinism"]

# 3D: meshes, materials, glTF models, a perspective camera and sun light,
# drawn under the 2D layer (`Transform3D`, `Model`, `ctx.camera3d`).
# Off: no 3D pass, no glTF loader in the build.
3d = ["dep:gltf", "image/jpeg", "image/hdr", "image/exr"]

# Runs on the main thread (AppKit requires it), so it is its own program
# without the test harness. Does nothing off macOS.
[[test]]
name = "ui_access_macos"
harness = false
required-features = ["accessibility"]

[[example]]
name = "physics"
required-features = ["physics"]

[[example]]
name = "physics3d"
required-features = ["physics3d"]

[[example]]
name = "vehicle"
required-features = ["physics3d"]

[[example]]
name = "3d"
required-features = ["3d"]

[[example]]
name = "shaders"
required-features = ["3d"]

[[example]]
name = "terrain"
required-features = ["3d"]

[[example]]
name = "streaming"
required-features = ["3d"]

[[example]]
name = "scene_viewer"
required-features = ["3d"]

[[example]]
name = "compute"
required-features = ["3d"]

[[example]]
name = "target_effect"
required-features = ["3d"]

[[example]]
name = "web_smoke_3d"
required-features = ["3d"]

[workspace]
members = [".", "crates/ponko_ecs", "crates/ponko_bench", "crates/ponko_mcp", "crates/ponko_ffi", "crates/ponko_unity"]

[workspace.package]
edition = "2024"
# The oldest Rust that builds Ponko (see STABILITY.md); CI checks it.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Leon Mamić and Ponko contributors"]
repository = "https://github.com/ponkoengine/ponko"
homepage = "https://ponko.dev/"

# Debug builds with light optimization: games and tests run 5-6x faster
# (boids 6.5 -> 1.1 ms/tick at 20k), edit -> build stays ~0.6 s, debug info
# stays. Clean builds take longer (16 -> 25 s for the test suite).
[profile.dev]
opt-level = 1

