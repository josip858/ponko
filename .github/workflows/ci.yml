# One failure never hides another: matrices don't fail fast, test steps run
# even after an earlier step failed, and --no-fail-fast runs every suite.
#
# Two tiers keep pull requests fast and runners free:
# - pull_request: only quick, high-signal Linux jobs (leaks, format, clippy,
#   Linux tests, feature contracts, docs, book).
# - merge_group (the merge queue), push to main and workflow_dispatch: the
#   full matrix (macOS, Windows, feature tests, Miri, MSRV, C/C++, web).
# A pull request labelled `full-ci` runs the full matrix too (for risky
# platform changes). Full-tier-only jobs carry
# `if: github.event_name != 'pull_request' || <full-ci label>`.
#
# Only events that change the code start this workflow. Labels and title or
# description edits go to pr-events.yml instead: GitHub can't filter
# `labeled` by label name, so here every area label would start (and, via
# the concurrency group, cancel) a whole run, and a lighter run publishing
# its own "CI passed" on the same commit could stand in for a failed one.
# pr-events.yml re-checks edited PR text for leaks and, when `full-ci` is
# added, starts this workflow on the branch with workflow_dispatch. That
# check isn't required, so the leaks job here re-reads the current PR text
# in the merge queue: an edited-in leak still blocks the merge.
#
# Build caches are saved only by runs on main (`save-if`). Every other run
# can restore those, and nothing can restore a cache saved from a merge
# queue ref. Saving elsewhere fills the repository's 10 GB cache quota, and
# GitHub then evicts main's caches: the next runs rebuild every dependency.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Not `edited` or `labeled`: see the header and pr-events.yml.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

# A new push to a pull request cancels its older run. Merge queue refs are
# unique per queue entry (GitHub cancels those itself when the queue changes),
# and every commit on main keeps its own full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # CI never reads debug info, and it makes linking (slow on Windows) and
  # the caches much bigger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Words from private projects that use the engine must never land here.
  # The list is the LEAK_WORDS secret (so it isn't in this repo either);
  # pull requests from forks don't get secrets, and skip it.
  leaks:
    name: Leak check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the title and description of each pull request in a merge group.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Files
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
        run: scripts/leak-check.sh files
      - name: Commit messages
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || format('{0}~1..{0}', github.sha) }}
        run: scripts/leak-check.sh messages "$RANGE"
      - name: Pull request title and description
        if: github.event_name == 'pull_request'
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/leak-check.sh text "$RUNNER_TEMP/pr.txt"
      # The title and description can change after the pull request's CI ran
      # (edits only re-run pr-events.yml, which isn't required). The merge
      # queue re-reads the current text of every pull request in the group,
      # so an edited-in leak blocks the merge. It fails closed: if it can't
      # name the pull requests or read one of them, the job fails.
      - name: Merge group pull request titles and descriptions
        if: github.event_name == 'merge_group'
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          RANGE: ${{ format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) }}
        run: |
          set -eu
          # The group's ref is [refs/heads/]gh-readonly-queue/<base>/pr-<number>-<sha>,
          # naming its newest pull request.
          newest=$(printf '%s\n' "$HEAD_REF" | sed -n 's|^\(refs/heads/\)\{0,1\}gh-readonly-queue/.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\2|p')
          if [ -z "$newest" ]; then
            echo "::error::No pull request number in merge group ref $HEAD_REF"
            exit 1
          fi
          # Pull requests batched ahead of it: their squash commits end in (#<number>).
          earlier=$(git log --format=%s "$RANGE" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')
          for pr in $(printf '%s\n' "$newest" $earlier | sort -un); do
            echo "Pull request #$pr"
            gh api "repos/$REPO/pulls/$pr" --jq '.title, (.body // "")' > "$RUNNER_TEMP/pr-$pr.txt"
            scripts/leak-check.sh text "$RUNNER_TEMP/pr-$pr.txt"
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Naming inventory and generated aliases
        run: |
          python3 scripts/check-naming.py
          python3 scripts/generate-ponko-header.py --check
      - name: Changelog fragments
        run: python3 scripts/changelog.py --check
      # Every C export needs a test, or a reasoned entry in the allowlist.
      - name: C ABI test coverage
        run: python3 scripts/check-ffi-coverage.py
      - run: cargo fmt --all --check

  # Reduced builds lint one package (`scope`), not the workspace: Cargo
  # unifies features across every package it builds, and other members turn
  # engine features on (the C library enables 3d and navmesh; the MCP
  # server's tests, the defaults).
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: profiling feature
            args: --features profiling
          - name: cross-platform deterministic physics
            args: --features ponko/physics-determinism
          - name: steam
            args: --features ponko/steam,ponko_ffi/steam
          - name: ECS without parallel
            scope: -p ponko_ecs
            args: --no-default-features
          - name: engine without window or audio
            scope: -p ponko
            args: --no-default-features
          - name: engine without window
            scope: -p ponko
            args: --no-default-features --features audio
          - name: engine with only a window (2D)
            scope: -p ponko
            args: --no-default-features --features window
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: clippy-${{ matrix.name }}
      - run: cargo clippy ${{ matrix.scope || '--workspace' }} --all-targets ${{ matrix.args }}

  # Reduced engine builds must not pull in optional subsystems (renderer,
  # audio devices, inspector, glTF, physics, navigation, dev tools); see the
  # script for each build's contract. It only resolves the dependency graph.
  feature-deps:
    name: Feature dependency contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check each reduced build's dependencies
        run: scripts/feature-deps.sh
      - name: A forbidden dependency fails the check
        run: scripts/feature-deps.sh self-test

  # The oldest supported Rust (rust-version in Cargo.toml) still builds everything.
  msrv:
    name: MSRV (Rust 1.95)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      - run: cargo check --workspace --all-targets --features ponko/physics,ponko/steam

  # Linux/macOS keep suites together. Windows integration tests, examples,
  # and archived unit-test shards run separately to shorten the critical path.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on Linux; the full tier adds macOS and Windows.
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Linux also runs doctests. Windows unit tests have their own job;
      # --test '*' selects all integration targets without running unit tests
      # a second time (--tests would include unit tests too). No job passes
      # --examples: the examples hold no tests, so it would only link each
      # one a second time, as a test binary. They are built once, below.
      - name: Tests (default features)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --no-fail-fast
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --no-fail-fast --bins --test '*'
          else
            cargo test --workspace --no-fail-fast --lib --bins --tests
          fi
      - name: Build examples
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo build --workspace --examples

  windows-unit-build:
    name: Compile unit and render tests (windows-latest)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This narrower build has a different dependency feature graph;
          # keep its cache separate from the full-workspace jobs.
          shared-key: windows-unit-engine
      - uses: ./.github/actions/nextest
      # Compile only the engine test binary. Other library suites run with
      # the examples, which already need the engine's non-test library.
      # These features match the workspace test union from FFI and benchmarks.
      # Shards reuse these binaries and runtime DLLs without recompiling.
      - name: Archive unit and render tests
        run: cargo nextest archive -p ponko --lib --features physics,physics3d,navmesh --archive-file target/windows-unit.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: windows-unit-tests
          path: target/windows-unit.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  windows-unit:
    name: Unit and render tests (Windows shard ${{ matrix.shard }}/6)
    needs: windows-unit-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@v8
        with:
          name: windows-unit-tests
          path: target/ci-unit
      # Slices cover every test exactly once. Limit concurrent tests per
      # runner so software-rendered GPU tests do not swamp the CPU. A few
      # render tests take two to three minutes each on the software adapter
      # and set the floor for a shard; six shards keep the rest of a slice
      # from adding much to that (three took over five minutes).
      - name: Run archived tests
        run: >-
          cargo nextest run --archive-file target/ci-unit/windows-unit.tar.zst
          --workspace-remap . --partition slice:${{ matrix.shard }}/6
          --test-threads 2 --no-fail-fast

  windows-gpu-tiers:
    name: Render tests on the ${{ matrix.tier }} GPU tier (windows-latest, ${{ matrix.shard }}/2)
    needs: windows-unit-build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `desktop` is the plain run in windows-unit.
        tier: [webgl2, baseline]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@v8
        with:
          name: windows-unit-tests
          path: target/ci-unit
      # The offscreen render suites again, every device opened with the
      # tier's limits (render_test_support::forced); tests needing a
      # feature the tier lacks skip with a logged reason. The capability
      # suite forces its own tiers and runs once, in windows-unit.
      - name: Run the render tests on the forced tier
        shell: bash
        env:
          PONKO_GPU_TIER: ${{ matrix.tier }}
          PONKO_REQUIRE_GPU: 1
        run: |
          set +e
          cargo nextest run --archive-file target/ci-unit/windows-unit.tar.zst \
            --workspace-remap . --partition slice:${{ matrix.shard }}/2 \
            --test-threads 2 --no-fail-fast --success-output final \
            -E '(test(render_test) & !test(capabilities_render_test)) | test(skinning::tests) | test(particles::tests)' \
            2>&1 | tee tier.log
          status=${PIPESTATUS[0]}
          opened=$(grep -c "as the $PONKO_GPU_TIER tier" tier.log)
          echo "devices opened on the forced $PONKO_GPU_TIER tier: $opened"
          if [ "$opened" -eq 0 ]; then
            echo "no render test opened a device on the forced tier" && exit 1
          fi
          exit $status

  windows-examples:
    name: Examples and library tests (windows-latest)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
      - name: Test other library crates
        run: cargo test --workspace --exclude ponko --lib --no-fail-fast
      - name: Build examples
        if: ${{ !cancelled() }}
        run: cargo build --workspace --examples

  # Feature variants run beside the default suite, rather than extending
  # its critical path with five more serial engine builds on every OS.
  test-features:
    name: Feature tests (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Windows needs its complete feature graph cached separately:
          # the faster default job otherwise wins the immutable cache key.
          shared-key: ${{ runner.os == 'Windows' && 'test-features' || 'test' }}
      - name: Tests, ECS without rayon
        if: ${{ !cancelled() }}
        run: cargo test -p ponko_ecs --tests --no-fail-fast --no-default-features
      # No optional feature at all: no renderer, audio device or inspector.
      # (Audio without a window is linted in the clippy job.)
      - name: Tests, engine with no default features
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --tests --no-fail-fast --no-default-features
      # Systems called through subsecond's jump table (no dx attached) behave the same.
      - name: Tests, engine with hotpatch
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features hotpatch --test headless --test determinism --test events
      # The same pile on every OS: rapier's cross-platform determinism.
      - name: Tests, physics with cross-platform determinism
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features physics-determinism --test physics
      # Steam itself isn't on the runners: this checks that the Steam library
      # links and loads on each OS, and the address mapping.
      - name: Tests, Steam transport
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features steam --lib net::steam

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache mdBook binary
        id: mdbook-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ runner.arch }}-0.5.4
      - uses: taiki-e/install-action@v2
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        with:
          tool: mdbook@0.5.4
      - run: mdbook --version
      - run: mdbook build book
      # The guide's inline Rust snippets: one `cargo check` of every block as a
      # module of a scratch crate (see book/src/contributing.md).
      - name: Install ALSA and udev headers (audio, gamepads)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: book-snippets
      - name: Compile the guide's Rust snippets
        run: python3 scripts/check-book-snippets.py

  miri:
    name: Miri (${{ matrix.name }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    # Miri interprets every instruction; tests shrink their sizes under
    # cfg(miri). The timeout catches a regression instead of hanging CI.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Our unsafe code under the strict model, without rayon.
          - name: ECS, stacked borrows
            args: --tests --no-default-features
            flags: ""
          # The parallel path. rayon's dependency crossbeam-epoch trips Stacked
          # Borrows (not our code), and its global pool outlives main.
          # `changes` holds the parallel loops over rows picked by change filters.
          - name: par_for_each, tree borrows
            args: --test parallel --test changes
            flags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p ponko_ecs --no-fail-fast ${{ matrix.args }}

  native:
    name: C and C++ (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: native
      - name: Find the cbindgen version in Cargo.lock
        shell: bash
        run: echo "CBINDGEN_VERSION=$(awk '/^name = "cbindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      # Install just the generator and cache its binary. Running the FFI
      # example would compile and link the engine before reading its source.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cbindgen@${{ env.CBINDGEN_VERSION }}
      - name: Verify generated C header
        shell: bash
        run: |
          mkdir -p target
          cbindgen --config crates/ponko_ffi/cbindgen.toml crates/ponko_ffi > target/crabby.generated.h
          python - <<'PYTHON'
          from pathlib import Path
          import difflib
          import sys
          # Git and cbindgen can produce different line endings on Windows.
          expected = Path("include/crabby.h").read_text().splitlines(keepends=True)
          actual = Path("target/crabby.generated.h").read_text().splitlines(keepends=True)
          sys.stdout.writelines(difflib.unified_diff(expected, actual, fromfile="checked in", tofile="generated"))
          sys.exit(expected != actual)
          PYTHON
      - run: cargo build -p ponko_ffi --release
      - run: cmake -S examples/cpp -B target/native -DCMAKE_BUILD_TYPE=Release -DPONKO_LIBRARY_DIR=${{ github.workspace }}/target/release
      - run: cmake --build target/native --config Release
      - run: ctest --test-dir target/native -C Release --output-on-failure

  # The web build (wasm32): lint the browser-only code, and build the battle
  # demo the way the docs site does.
  web:
    name: Web build
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --examples
      # The 3D examples (the 3D browser smoke fixture among them) need the feature.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d --examples
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: web/build.sh battle

  # The browser runner's own tests (web/smoke/*.test.mjs): argument and
  # fixture handling, the supported/unsupported decisions, and that a browser
  # that can't start is reported as unsupported with its reason. No browser or
  # wasm build, so it runs on every pull request.
  web-smoke-runner:
    name: Web smoke runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --prefix web/smoke --no-audit --no-fund
      - run: node --test web/smoke/*.test.mjs

  # Runs web builds in headless browsers (web/smoke/README.md): startup,
  # asset fetch, fixed-step progress, a click, a nonblank canvas, and the
  # adapter the engine itself reports. Three builds, each fixture from
  # web/smoke/fixtures.json: the 2D fixture, the 3D one (`--features 3d`) and
  # the complete-game reference. Chromium and WebKit run the WebGL2 path,
  # which must pass in each. Firefox is tried and reported: the runner's
  # headless Firefox has no WebGL2 (no GPU), so it passes as "unsupported"
  # there. GitHub's runners have no GPU, so WebGPU is
  # tried (headless shell and the full browser's new headless mode) and
  # reported: a browser that can't show a WebGPU canvas passes as
  # "unsupported" with the reason in its report and in the job summary, never
  # as a quiet pass; one that can must actually draw it.
  web-smoke:
    name: Web smoke test (headless browsers)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web-smoke
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      # The browsers are about 500 MB: Playwright downloads only what this
      # cache lacks (the version is pinned by the lockfile).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/smoke/package-lock.json') }}
      - name: Install the runner and the browsers (Chromium with its headless shell, Firefox, WebKit)
        run: |
          node --version
          npm ci --prefix web/smoke --no-audit --no-fund
          node web/smoke/node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Runner tests
        run: node --test web/smoke/*.test.mjs
      - name: Build the fixtures (2D, 3D with --features 3d, the complete game)
        run: |
          web/build.sh web_smoke
          web/build.sh --features 3d web_smoke_3d
          web/build.sh coin_dash
      # Chromium, WebGL2 (WebGPU hidden, the fallback path).
      - name: Chromium, WebGL2, 2D fixture
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgl2 --chrome-trace
      - name: Chromium, WebGL2, 3D fixture
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke_3d --browser chromium --backend webgl2
      # The complete-game reference (examples/coin_dash): its coin picture is
      # fetched and decoded, a click and keys reach it, and the screens it
      # reports follow them (play, pause, title, the retained-UI settings
      # screen, Escape closing it again; see fixtures.json). The web build
      # keeps no progress yet (no files in a browser).
      - name: Chromium, WebGL2, coin_dash (assets, a click, keys, screens)
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture coin_dash --browser chromium --backend webgl2
      # WebGPU: the headless shell, then the full browser's new headless mode
      # with software Vulkan (a WebGPU canvas is presented through its
      # compositor). Each passes only if it draws or is reported unsupported.
      - name: Chromium, WebGPU, headless shell
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgpu --allow-unsupported
      - name: Chromium, WebGPU, new headless mode (2D and 3D fixtures)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser chromium --chromium-mode new --backend webgpu \
              --browser-arg --use-webgpu-adapter=swiftshader --allow-unsupported || status=1
          done
          exit $status
      - name: Chromium, whatever the engine picks
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend auto --allow-unsupported
      # WebKit: WebGL2 must pass; WebGPU is reported. Firefox: both are
      # reported. Headless Firefox has no WebGL2 on a runner without a GPU
      # (also with Mesa's software GL installed), so "unsupported" passes
      # here with its reason; anything else it does wrong still fails.
      - name: Firefox, WebGL2 (2D and 3D fixtures; reported where it has no WebGL2)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser firefox --backend webgl2 --allow-unsupported || status=1
          done
          exit $status
      - name: Firefox, WebGPU
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser firefox --backend webgpu --allow-unsupported
      - name: WebKit, WebGL2 (2D and 3D fixtures)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser webkit --backend webgl2 || status=1
          done
          exit $status
      - name: WebKit, WebGPU
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser webkit --backend webgpu --allow-unsupported
      # The runner itself: each broken build must be caught as that failure.
      - name: Self-tests (missing asset, startup panic, stalled simulation)
        if: ${{ !cancelled() }}
        run: |
          for case in missing-asset panic stall; do
            node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgl2 --case "$case"
          done
      # Every run, with what it asked for, what ran, the adapter the engine
      # reported and why anything was unsupported (also in the artifact).
      - name: Summary of every run
        if: ${{ !cancelled() }}
        run: node web/smoke/summary.mjs target/web-smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-smoke
          path: target/web-smoke
          retention-days: 7

  # The complete-game reference, packaged the way a player gets it and played
  # from an unrelated folder (scripts/package-coin-dash.py, book/src/packaging.md):
  # the program, its assets, the licenses and the content and third-party
  # notices; then, on every OS, a headless walk-through (assets found outside
  # the checkout, saves, damaged-save recovery, the OS's default save folder,
  # missing assets failing loudly) and a walk-through in a real window. Linux
  # has no display or GPU: a virtual display and software Vulkan (lavapipe)
  # are installed and the window run must open a window there too. Windows
  # runners have no GPU: the step before the window run restricts wgpu to
  # DirectX 12 (WARP) when no real one is present. A window that can't open is a
  # failure on every OS; only the local `--allow-unsupported` run passes it.
  # The dev profile is packaged: the layout and notices are the release's, and
  # the dependencies are the ones the test jobs already built.
  package-smoke:
    name: Packaged game (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads), a virtual display with the X11 libraries a window loads, and software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev xvfb mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libxinerama1 libx11-xcb1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          # Linux and macOS read the `test` cache (same dev build, default
          # features) and never write it here. Windows has no cache of that kind
          # to share (`test-features` holds other feature builds), so it keeps
          # its own and does not overwrite anyone else's.
          save-if: ${{ github.ref == 'refs/heads/main' || runner.os == 'Windows' }}
          shared-key: ${{ runner.os == 'Windows' && 'package-smoke' || 'test' }}
      - name: The script's own checks (a crate without a license, window errors)
        run: python scripts/package-coin-dash.py selftest
      - name: Package
        run: python scripts/package-coin-dash.py package --profile dev --out target/package
      - name: Smoke test, headless (an unpacked copy, started from an unrelated folder)
        if: ${{ !cancelled() }}
        run: python scripts/package-coin-dash.py smoke --package target/package --mode headless
      # The engine reads WGPU_BACKEND (not WGPU_ADAPTER_NAME). With only DirectX 12
      # enabled, the one adapter left on a runner without a GPU is WARP, the
      # software renderer, which the engine accepts.
      - name: Windows without a GPU, use the software renderer (WARP) through DirectX 12
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name | Format-Table
          $real = Get-CimInstance Win32_VideoController | Where-Object { $_.Name -notmatch 'Basic Render|Remote Display|Hyper-V|Basic Display' }
          if (-not $real) {
            "WGPU_BACKEND=dx12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "No GPU on this runner: DirectX 12 only, so wgpu picks WARP"
          }
      - name: Smoke test, in a window
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/package-coin-dash.py smoke --package target/package --mode window
          else
            python scripts/package-coin-dash.py smoke --package target/package --mode window
          fi

  # Single check for branch protection and the merge queue: passes only if
  # every job above passed. Requiring one job keeps the rule valid when jobs
  # are added or renamed. Jobs a plain pull request skips (fast tier) are
  # fine; in the full tier a skipped job is a failure. Keep the name
  # "CI passed": branch protection matches it.
  ci-passed:
    name: CI passed
    if: always()
    needs: [leaks, fmt, clippy, feature-deps, msrv, test, windows-unit-build, windows-unit, windows-gpu-tiers, windows-examples, test-features, docs, book, miri, native, web, web-smoke-runner, web-smoke, package-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          SKIPPED: ${{ contains(needs.*.result, 'skipped') }}
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          echo "$NEEDS"
          if [ "$FAILED" = "true" ]; then
            echo "Some jobs failed or were cancelled." && exit 1
          fi
          if [ "$FULL" = "true" ] && [ "$SKIPPED" = "true" ]; then
            echo "Some jobs were skipped in a full run." && exit 1
          fi
          echo "Every job this event runs passed."
