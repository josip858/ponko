[package]
name = "ponko_bench"
default-run = "ponko_bench"
version = "0.0.1"
description = "Benchmarks: ponko_ecs vs bevy_ecs vs hecs, and simulation at scale."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ponko_ecs = { path = "../../crates/ponko_ecs", version = "0.0.1" }
ponko = { path = "../..", version = "0.0.1", default-features = false, features = ["physics", "physics3d", "navmesh"] }
rapier2d = "0.36.1"
rapier3d = "0.36.1"
rayon = "1.12.0"
# `multi_threaded` for `par_iter_mut`; `bevy_tasks` to start its thread pool.
bevy_ecs = { version = "0.20.1", features = ["multi_threaded"] }
bevy_tasks = { version = "0.20.1", features = ["multi_threaded"] }
hecs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The thread CPU clock of the streaming benchmark (wall time elsewhere).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
render = ["ponko/window"]

[[bin]]
name = "instances"
path = "src/bin/instances.rs"
required-features = ["render"]

[[bin]]
name = "characters"
path = "src/bin/characters.rs"
