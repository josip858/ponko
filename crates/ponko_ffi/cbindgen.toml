language = "C"
include_guard = "CRABBY_H"
cpp_compat = true
usize_is_size_t = true
documentation = false
autogen_warning = "/* Generated by cbindgen. Regenerate: cargo run -p ponko_ffi --example generate_header > include/crabby.h */"
header = """
/* Ponko C ABI, version 2. C++: include crabby.hpp instead.
 *
 * Games: crabby_game_new -> settings and systems -> crabby_game_run (window)
 * or crabby_game_run_headless. Systems get a CrabbyCtx*, valid until they
 * return: the world (crabby_ctx_world), clock, input, drawing, shapes, text
 * and fonts, UI widgets, sound, textures, camera, commands (*_later), events
 * (crabby_ctx_send_event / crabby_ctx_read_events), the built-in spatial
 * grid, physics and lockstep multiplayer (crabby_game_lockstep_host/join,
 * crabby_ctx_set_input / crabby_ctx_input).
 *
 * Handles are confined to the thread that runs the game, except inside
 * crabby_query_par callbacks, which run on many threads at once and may only
 * touch their chunk, crabby_ctx_dt/sim_tick/random_bits and spatial queries.
 * Non-null pointers must refer to live, correctly aligned memory of the stated
 * size; dangling/forged pointers cannot be detected. Only free owned handles,
 * exactly once. Components made from C are memcpy-safe values without
 * destructors. Built-ins: Transform2D (CrabbyTransform2D, a plain value) and
 * Sprite (CrabbySprite in spawn/get/set, never a query column); with physics,
 * RigidBody and Collider (CrabbyRigidBody, CrabbyCollider: like sprites) and
 * Velocity (CrabbyVelocity, a plain value). 3D: Transform3D and Model
 * (CrabbyTransform3D, CrabbyModel: plain values); with physics3d,
 * RigidBody3D, Collider3D and Character3D (like sprites) and Velocity3D
 * (CrabbyVelocity3D, a plain value).
 *
 * Queries take up to 32 distinct component ids; zero ids match every entity.
 * Columns follow query order with registered-size stride; chunk memory expires
 * when the callback returns. While a query runs, every world and ctx call
 * returns CRABBY_BUSY, except commands (crabby_query only) and spatial queries.
 * Callbacks must return normally: C++ exceptions and Rust panics must never
 * cross the C boundary (crabby.hpp catches them for you).
 *
 * Retained UI tree operations take a target: CRABBY_UI_SCREEN for the
 * screen's own UI, or an entity with a world-space panel (crabby_ctx_create_ui_panel)
 * for that panel's UI.
 *
 * Enums (CrabbyKey, CrabbyMouseButton, CrabbyGamepadButton, CrabbyGamepadAxis,
 * CrabbyTextAlign3D, CrabbyBodyKind, CrabbyShapeKind, CrabbyShape3DKind, CrabbyNetState, CrabbyPhase, CrabbyService, CrabbyHandleKind, CrabbyResidencyKind, CrabbyAssetState, CrabbyGpuTier, CrabbyGpuFeature, and the
 * CrabbyUi* layout and paint enums) are passed as uint32_t.
 * Last-error text is thread-local, borrowed until the next failed call;
 * successful calls leave it unchanged.
 */
"""
[parse]
parse_deps = false
[export]
exclude = ["Failure"]
include = ["CrabbyTextAlign3D", "CrabbyActionSource", "CrabbyHandleKind", "CrabbyResidencyKind", "CrabbyAssetState", "CrabbyKey", "CrabbyMouseButton", "CrabbyGamepadButton", "CrabbyGamepadAxis", "CrabbyTransform2D", "CrabbySprite", "CrabbyFieldType", "CrabbyAnimation", "CrabbyAttached", "CrabbyBodyKind", "CrabbyPhase", "CrabbyService", "CrabbyShapeKind", "CrabbyVelocity", "CrabbyNetState", "CrabbyTransform3D", "CrabbyModel", "CrabbyPointLight3D", "CrabbySpotLight3D", "CrabbyReceivesDecals", "CrabbyShape3DKind", "CrabbyVelocity3D", "CrabbyParticleShape3D", "CrabbyParticleBlend3D", "CrabbyParticleSpace3D", "CrabbyLayerBlend", "CrabbyRootMotion", "CrabbyUiDisplay", "CrabbyUiPosition", "CrabbyUiFlexDirection", "CrabbyUiFlexWrap", "CrabbyUiAlign", "CrabbyUiAlignContent", "CrabbyUiLengthKind", "CrabbyUiTrackKind", "CrabbyUiGridLineKind", "CrabbyUiTextAlign", "CrabbyGpuTier", "CrabbyGpuFeature"]
